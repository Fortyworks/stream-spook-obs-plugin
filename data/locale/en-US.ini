Stinger.Info="The animation, colors, text, length and cut point are set in the StreamSpook app (Scene transition), and can differ for each scene you switch to. The app writes the length into OBS (the Duration field and each scene's transition override), so leave those to the app. Keep the app running while you stream: the animation is served by it."
